# =============================================================================
# CONFIG — this is the only file you should need to touch month to month.
# Edit search queries and deal rules here. No code changes needed.
# =============================================================================

global:
  # Vinted runs a SEPARATE SITE PER COUNTRY. The bot searches every domain
  # listed here and tags each result with which one it came from, so you only
  # see listings from places you can actually order from.
  domains:
    - name: "Slovakia"
      base_url: "https://www.vinted.sk"
    - name: "Czech Republic"
      base_url: "https://www.vinted.cz"
    - name: "Poland"
      base_url: "https://www.vinted.pl"

  # Seconds to wait between each search query (be polite, avoid bot-detection)
  delay_between_queries_sec: 5
  # Extra pause when switching from one country's domain to the next
  delay_between_domains_sec: 3
  # How many of the newest listings to pull per query, per domain, per run
  items_per_query: 40
  # Rolling price history window used for the "self-learning" average-price rule.
  # Kept SEPARATE per country (prices/currencies differ), so a search's average
  # is only ever compared against other listings from the same domain.
  price_history_window: 50

# Each entry below is one independent search + its own deal-scoring rules.
# It runs across ALL domains listed above automatically — you don't repeat
# it per country. Add/remove/edit entries freely.
searches:

  - name: "Charizard PSA 10"
    # Vinted catalog search params (mirrors what you'd type into the site's search box).
    # Do NOT set "currency" here — each domain reports prices in its own native
    # currency (EUR for SK, CZK for CZ, PLN for PL) and the bot handles that per item.
    params:
      search_text: "charizard psa 10"
      catalog_ids: "2971"     # Trading cards catalog id — same across Vinted domains
      order: "newest_first"
    rules:
      max_price: 400                # in the local currency of whichever domain matched
      min_price: 20
      below_rolling_average_pct: 15 # alert if price is >=15% below recent average for this search+domain
      include_keywords: ["psa 10"]
      exclude_keywords: ["proxy", "custom", "fake", "reprint", "case only", "empty"]
      min_score_to_alert: 60        # 0-100, see README for how score is computed

  - name: "Booster Box Sealed"
    params:
      search_text: "pokemon booster box sealed"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      max_price: 180
      min_price: 30
      below_rolling_average_pct: 10
      include_keywords: ["scellé", "sealed", "neuf", "nová", "zapieczętowane"]
      exclude_keywords: ["vide", "empty", "ouvert", "opened", "otevřené", "otwarte"]
      min_score_to_alert: 55

  - name: "Base Set Cards"
    params:
      search_text: "pokemon base set 1999"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      max_price: 250
      min_price: 5
      below_rolling_average_pct: 20
      include_keywords: []
      exclude_keywords: ["proxy", "custom", "fake"]
      min_score_to_alert: 65

discord:
  # Set the real URL as a GitHub Actions secret named DISCORD_WEBHOOK_URL — never commit it here.
  webhook_url_env_var: "DISCORD_WEBHOOK_URL"
  mention_role_id_env_var: "DISCORD_ROLE_ID"   # optional, leave unset if not used
