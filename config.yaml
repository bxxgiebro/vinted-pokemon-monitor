# =============================================================================
# CONFIG — this is the only file you should need to touch month to month.
# Edit search queries and deal rules here. No code changes needed.
# =============================================================================

global:
  vinted_base_url: "https://www.vinted.sk"

  delay_between_queries_sec: 5
  items_per_query: 40
  price_history_window: 50

# One search per PRODUCT (not just per set) — an ETB, a booster box, and an
# SPC for the same set are priced completely differently, so they're kept as
# separate searches with their own price history. include_keywords are now
# product-specific (not just "sealed") so an ETB listing can't accidentally
# pollute a booster box search's price history and vice versa.
searches:

  - name: "Destined Rivals ETB"
    params:
      search_text: "destined rivals"
      catalog_ids: "2971"     # Vinted trading cards catalog id
      order: "newest_first"
    rules:
      min_pct_below_average: 30
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      absolute_steal_price: 125
      include_keywords: ["etb", "elite trainer box"]
      exclude_keywords: ["otvorené", "opened", "single card", "1 karta", "loose card",
                          "booster box", "booster bundle"]

  - name: "Destined Rivals Booster Box"
    params:
      search_text: "destined rivals booster box"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      min_pct_below_average: 30
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      absolute_steal_price: 300
      include_keywords: ["booster box", "booster bundle"]
      exclude_keywords: ["otvorené", "opened", "single card", "1 karta", "loose card",
                          "etb", "elite trainer box"]

  - name: "Prismatic Evolutions ETB"
    params:
      search_text: "prismatic evolutions"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      min_pct_below_average: 30
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      absolute_steal_price: 140
      include_keywords: ["etb", "elite trainer box"]
      exclude_keywords: ["otvorené", "opened", "single card", "1 karta", "loose card",
                          "booster box", "booster bundle", "spc", "super premium collection",
                          "premium collection"]

  - name: "Prismatic Evolutions SPC"
    params:
      search_text: "prismatic evolutions super premium collection"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      min_pct_below_average: 30
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      absolute_steal_price: 250
      include_keywords: ["spc", "super premium collection", "premium collection"]
      exclude_keywords: ["otvorené", "opened", "single card", "1 karta", "loose card"]

  - name: "Ascended Heroes ETB"
    params:
      # "Ascended Heroes" is the actual set name (Mega Evolution—Ascended Heroes,
      # released Feb 2026) — adjust here if you meant a different set.
      search_text: "ascended heroes"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      min_pct_below_average: 30
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      absolute_steal_price: 140
      include_keywords: ["etb", "elite trainer box"]
      exclude_keywords: ["otvorené", "opened", "single card", "1 karta", "loose card",
                          "booster box", "booster bundle"]

discord:
  webhook_url_env_var: "DISCORD_WEBHOOK_URL"
  mention_role_id_env_var: "DISCORD_ROLE_ID"
