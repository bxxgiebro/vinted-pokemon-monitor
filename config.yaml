# =============================================================================
# CONFIG — this is the only file you should need to touch month to month.
# Edit search queries and deal rules here. No code changes needed.
# =============================================================================

global:
  # Only Slovakia — cross-border shipping availability varies by country, and
  # what you can actually order into Slovakia isn't the same as what a Polish
  # or Czech buyer can. Rather than guess at that, this only searches the site
  # you can order from directly. Add other domains back if that changes.
  domains:
    - name: "Slovakia"
      base_url: "https://www.vinted.sk"

  delay_between_queries_sec: 5
  delay_between_domains_sec: 3
  items_per_query: 40
  price_history_window: 50

# One search per set/ETB you're hunting restocks for. Add more sets below the
# same way as new ones release — copy a block, change search_text and name.
searches:

  - name: "Destined Rivals ETB"
    params:
      search_text: "destined rivals"
      catalog_ids: "2971"     # Trading cards catalog id
      order: "newest_first"
    rules:
      min_pct_below_average: 30
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      # If you already know what a steal price looks like for this set, set
      # it here to alert immediately, without waiting for 5+ prices of history
      # to build up. Leave as null to rely purely on the relative comparison
      # above.
      absolute_steal_price: 110
      # Sealed-only filter: must mention one of these product terms...
      include_keywords: ["etb", "elite trainer box", "booster box", "sealed",
                          "zapečatené", "neotvorené", "booster bundle"]
      # ...and must NOT look like a loose single card or already-opened box.
      exclude_keywords: ["otvorené", "opened", "single card", "1 karta", "loose card"]

  - name: "Prismatic Evolutions ETB"
    params:
      search_text: "prismatic evolutions"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      min_pct_below_average: 30
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      # If you already know what a steal price looks like for this set, set
      # it here to alert immediately, without waiting for 5+ prices of history
      # to build up. Leave as null to rely purely on the relative comparison
      # above.
      absolute_steal_price: 130
      include_keywords: ["etb", "elite trainer box", "booster box", "sealed",
                          "zapečatené", "neotvorené", "booster bundle"]
      exclude_keywords: ["otvorené", "opened", "single card", "1 karta", "loose card"]

  - name: "Ascended Heroes ETB"
    params:
      # "Ascended Heroes" is the actual set name (Mega Evolution—Ascended Heroes,
      # released Feb 2026) — adjust here if you meant a different set.
      search_text: "ascended heroes"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      min_pct_below_average: 30
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      # If you already know what a steal price looks like for this set, set
      # it here to alert immediately, without waiting for 5+ prices of history
      # to build up. Leave as null to rely purely on the relative comparison
      # above.
      absolute_steal_price: 130
      include_keywords: ["etb", "elite trainer box", "booster box", "sealed",
                          "zapečatené", "neotvorené", "booster bundle"]
      exclude_keywords: ["otvorené", "opened", "single card", "1 karta", "loose card"]

discord:
  webhook_url_env_var: "DISCORD_WEBHOOK_URL"
  mention_role_id_env_var: "DISCORD_ROLE_ID"
