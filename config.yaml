# =============================================================================
# CONFIG — this is the only file you should need to touch month to month.
# Edit search queries and deal rules here. No code changes needed.
# =============================================================================

global:
  # Vinted runs a SEPARATE SITE PER COUNTRY. The bot searches every domain
  # listed here and tags each result with which one it came from, so you only
  # see listings from places you can actually order from.
  domains:
    - name: "Slovakia"
      base_url: "https://www.vinted.sk"
    - name: "Czech Republic"
      base_url: "https://www.vinted.cz"
    - name: "Poland"
      base_url: "https://www.vinted.pl"

  delay_between_queries_sec: 5
  delay_between_domains_sec: 3
  # How many of the newest listings to pull per query, per domain, per run
  items_per_query: 40
  # Rolling price history window used to judge what a "steal" looks like.
  # Kept SEPARATE per country (different currencies), so an item is only ever
  # compared against recent listings from the same domain.
  price_history_window: 50

# Each entry below is one independent search + its own steal-detection rules.
# It runs across ALL domains listed above automatically.
searches:

  - name: "Charizard PSA 10"
    params:
      search_text: "charizard psa 10"
      catalog_ids: "2971"     # Trading cards catalog id — same across Vinted domains
      order: "newest_first"
    rules:
      # A listing only alerts if BOTH of these are true:
      min_pct_below_average: 30   # must be at least 30% cheaper than recent average
      must_beat_recent_low: true  # AND must undercut the single cheapest recent listing
      min_history_size: 5         # need at least this many past prices before judging
      # Nothing below is applied unless you explicitly set it — no keyword or
      # low-price filtering by default. Judging "fake" or "mispriced" is on you.
      max_price: null
      min_price: null
      include_keywords: []
      exclude_keywords: []

  - name: "Booster Box Sealed"
    params:
      search_text: "pokemon booster box sealed"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      min_pct_below_average: 30
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      include_keywords: []
      exclude_keywords: []

  - name: "Base Set Cards"
    params:
      search_text: "pokemon base set 1999"
      catalog_ids: "2971"
      order: "newest_first"
    rules:
      min_pct_below_average: 35   # rarer/wider price spread, so a bigger gap needed
      must_beat_recent_low: true
      min_history_size: 5
      max_price: null
      min_price: null
      include_keywords: []
      exclude_keywords: []

discord:
  webhook_url_env_var: "DISCORD_WEBHOOK_URL"
  mention_role_id_env_var: "DISCORD_ROLE_ID"
