name: Vinted Pokemon Monitor

on:
  repository_dispatch:
    types: [run-monitor]   # triggered by the external cron-job.org pinger, see README
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated state files back

concurrency:
  group: vinted-monitor
  cancel-in-progress: false   # never kill a run mid-way; queue instead

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        run: python src/monitor.py

      - name: Commit updated state
        run: |
          git config user.name "vinted-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_items.json data/price_history.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update monitor state [skip ci]"

          # Retry with rebase: if main moved since checkout (e.g. you edited
          # config.yaml on GitHub while this run was mid-flight), fetch the
          # latest and replay our state-file commit on top instead of just
          # failing outright.
          attempt=1
          max_attempts=5
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::warning::Push failed after $max_attempts attempts — state for this run was not saved. Next run will pick up from the last successfully saved state."
              exit 0   # don't fail the whole job over a state-save race; the monitor itself already ran successfully
            fi
            echo "Push rejected (attempt $attempt/$max_attempts) — fetching and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::warning::Rebase conflict on state files — aborting rebase, skipping state save for this run."
              git rebase --abort
              exit 0
            fi
            sleep $((RANDOM % 5 + 2))
            attempt=$((attempt + 1))
          done

